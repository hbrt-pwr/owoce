{% load static %}<ul class="pw-rules" aria-live="polite" data-check-url="{% url 'password_check' %}"
    data-password="{{ password_id }}" data-confirm="{{ confirm_id }}" data-username="{{ username }}" data-email="{{ email }}">
  {% for rule in rules %}<li data-i="{{ forloop.counter0 }}">{{ rule }}</li>
  {% endfor %}<li data-match>Oba wpisane hasła muszą być takie same.</li>
</ul>
<script src="{% static 'password-rules.js' %}" defer></script>

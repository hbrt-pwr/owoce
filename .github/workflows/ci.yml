
name: Owocownik CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Static analysis, tests and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit pip-audit

      - name: Ruff - code quality
        run: ruff check .

      - name: Bandit - security analysis
        run: bandit -r config fruits -x fruits/tests.py,fruits/migrations

      - name: pip-audit - dependency vulnerabilities
        run: pip-audit -r requirements.txt

      - name: Django configuration check
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py check

      - name: Run Django tests
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py test

      - name: Build Docker image
        run: docker build -t owoce:${GITHUB_SHA} .
